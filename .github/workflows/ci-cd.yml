name: CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

env:
  JAVA_VERSION: "23"
  MAVEN_OPTS: -Xmx2g
  GITHUB_ACTIONS: true

jobs:
  # Build and test on push/PR
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libgtk-4-dev \
            libgtk-4-1 \
            maven \
            dpkg-dev \
            rpm \
            tar \
            gzip \
            file \
            gobject-introspection \

      - name: Compile project
        run: mvn clean compile

      - name: Run tests
        run: mvn test

      - name: Generate test report
        if: always()
        run: |
          mkdir -p test-reports
          find . -name "surefire-reports" -type d -exec cp -r {} test-reports/ \;

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-reports/
          retention-days: 7

  # Build packages on push to main/develop or on tags
  build-packages:
    name: Build Distribution Packages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "maven"

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            rpm \
            wget \
            tar \
            gzip \
            libgirepository1.0-dev \
            libgtk-4-dev \
            libgtk-4-1 \
            maven \
            file \
            gobject-introspection \
            fuse \
            libfuse2

      - name: Verify FUSE availability
        run: |
          echo "Checking FUSE availability for AppImage building..."
          ls -la /dev/fuse || echo "FUSE device not found (will use --appimage-extract-and-run)"
          if [ -e /dev/fuse ]; then
            echo "FUSE device exists"
            if [ -r /dev/fuse ]; then
              echo "FUSE device is readable"
            fi
            if [ -w /dev/fuse ]; then
              echo "FUSE device is writable"
            fi
          fi
          echo "GitHub Actions environment: $GITHUB_ACTIONS"

      - name: Extract version from tag and update pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version: $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          echo "Updated pom.xml to version $VERSION"
          echo "Verifying version in all modules:"
          grep -h "<version>$VERSION</version>" pom.xml core/pom.xml omc-gtk/pom.xml || echo "Warning: Version mismatch detected"

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Make scripts executable
        run: chmod +x omc-gtk/scripts/*.sh

      - name: Build all packages
        run: bash omc-gtk/scripts/build-packages.sh --all

      - name: List built packages
        run: |
          echo "Built packages:"
          ls -lh dist/

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-packages
          path: dist/
          retention-days: 30

  # Build Arch Linux package
  build-arch-package:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            jdk-openjdk \
            maven \
            git \
            gtk4 \
            gobject-introspection \
            namcap \
            nodejs

      - name: Set JAVA_HOME
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/default" >> $GITHUB_ENV
          echo "/usr/lib/jvm/default/bin" >> $GITHUB_PATH

      - name: Create non-root user for makepkg
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Extract version from tag and update pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Extracted version: $VERSION"
          sudo -u builder mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          echo "Updated pom.xml to version $VERSION"

      - name: Build JAR
        run: |
          sudo -u builder mvn clean package -DskipTests

      - name: Make scripts executable
        run: chmod +x omc-gtk/scripts/*.sh

      - name: Build Arch package
        run: |
          sudo -u builder bash omc-gtk/scripts/build-packages.sh --arch

      - name: List built packages
        run: |
          echo "Built Arch packages:"
          ls -lh dist/*.pkg.tar.zst || echo "No Arch packages found"

      - name: Upload Arch package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst
          retention-days: 30

  # Create GitHub release and attach packages (only on tags)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-packages, build-arch-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: distribution-packages
          path: dist/

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md <<EOF
          ## Open Media Converter ${{ steps.version.outputs.VERSION }}

          ### Installation

          #### Debian/Ubuntu
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/open-media-converter_${{ steps.version.outputs.VERSION }}_amd64.deb
          sudo dpkg -i open-media-converter_${{ steps.version.outputs.VERSION }}_amd64.deb
          sudo apt-get install -f
          \`\`\`

          #### Fedora/RHEL
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/open-media-converter-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
          sudo dnf install open-media-converter-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
          \`\`\`

          #### Arch Linux
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/open-media-converter-${{ steps.version.outputs.VERSION }}-1-x86_64.pkg.tar.zst
          sudo pacman -U open-media-converter-${{ steps.version.outputs.VERSION }}-1-x86_64.pkg.tar.zst
          \`\`\`

          #### AppImage (Universal)
          \`\`\`bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Open_Media_Converter-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          chmod +x Open_Media_Converter-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          ./Open_Media_Converter-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          \`\`\`

          ### Changes
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

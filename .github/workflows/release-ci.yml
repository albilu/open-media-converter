name: Release CI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    validation:
        uses: ./.github/workflows/test-ci.yml

    release:
        needs: validation
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Extract version from tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  case "$REF_NAME" in
                    v[0-9]*.[0-9]*) version="${REF_NAME#v}" ;;
                    *) echo "Invalid release tag" >&2; exit 2 ;;
                  esac
                  if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
                    echo "Invalid release version" >&2
                    exit 2
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              run: ./docker-build.sh build

            - name: Build packages (.deb/.rpm/.pkg.tar.zst/.AppImage)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh package "$VERSION"

            - name: Verify every package and bundled runtime
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -v "$(pwd):/app:ro" omc-dev /app/packaging/verify-packages.sh "$VERSION"

            - name: Install test (.deb on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  docker run --rm -e VERSION -v "$(pwd)/packaging/dist:/pkgs:ro" ubuntu:24.04 bash -ec '
                    apt-get update -qq
                    apt-get install -y -qq "/pkgs/open-media-converter_${VERSION}_amd64.deb"
                    ffmpeg -version
                    ffprobe -version
                    pandoc --version
                    /usr/bin/open-media-converter --version
                  '

            - name: AppImage portability (clean Ubuntu 22.04 and 24.04)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  for distro in 22.04 24.04; do
                    docker build -f packaging/appimage/smoke.Dockerfile \
                      --build-arg "DISTRO=$distro" -t "omc-appimage-smoke:$distro" .
                    docker run --init --rm --network none -v "$(pwd):/app:ro" \
                      "omc-appimage-smoke:$distro" bash /app/packaging/verify-appimage.sh \
                      "/app/packaging/dist/Open_Media_Converter-${VERSION}-x86_64.AppImage"
                  done

            - name: Create release and attach packages
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  fail_on_unmatched_files: true
                  body: |
                      Packages for ${{ github.ref_name }}:

                      - `open-media-converter_${{ steps.version.outputs.version }}_amd64.deb` — Debian/Ubuntu
                      - `open-media-converter-${{ steps.version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
                      - `open-media-converter-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` — Arch Linux
                      - `Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.AppImage` — Universal

                      Native packages use system FFmpeg/ffprobe and Pandoc. AppImage bundles these tools.
                      ImageMagick and LibreOffice are system dependencies for all formats.
                      RPM installations need a repository providing full FFmpeg (for example, RPM Fusion).
                  files: |
                      packaging/dist/open-media-converter_${{ steps.version.outputs.version }}_amd64.deb
                      packaging/dist/open-media-converter-${{ steps.version.outputs.version }}-1.x86_64.rpm
                      packaging/dist/open-media-converter-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst
                      packaging/dist/Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.AppImage

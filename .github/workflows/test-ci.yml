name: Test CI

on:
    workflow_call:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Build Docker image
              run: ./docker-build.sh build

            # Suite requires GTK4, ffmpeg, imagemagick, pandoc, LibreOffice
            # and Xvfb — all provided by the project Docker image (see
            # AGENTS.md).
            - name: Run tests
              run: ./docker-build.sh test

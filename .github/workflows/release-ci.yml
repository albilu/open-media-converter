name: Release CI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read

jobs:
    # validation:
    #     uses: ./.github/workflows/test-ci.yml

    release:
        # needs: validation
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Extract version from tag
              id: version
              env:
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  case "$REF_NAME" in
                    v[0-9]*.[0-9]*) version="${REF_NAME#v}" ;;
                    *) echo "Invalid release tag" >&2; exit 2 ;;
                  esac
                  if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,3}$ ]]; then
                    echo "Invalid release version" >&2
                    exit 2
                  fi
                  printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

            - name: Build Docker image
              run: ./docker-build.sh build

            - name: Build packages (.deb/.rpm/.pkg.tar.zst/.AppImage)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: ./docker-build.sh package "$VERSION"

            - name: Verify every package and bundled runtime
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm --privileged -v "$(pwd):/app:ro" -v "$HOME/.omc-flatpak:/home/developer/.local/share/flatpak" omc-dev /app/packaging/verify-packages.sh "$VERSION"

            - name: Install test (.deb on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -e VERSION -v "$(pwd)/packaging:/pkgs:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq "/pkgs/open-media-converter_${VERSION}_amd64.deb" && test -x /usr/bin/open-media-converter'

            - name: Install test (.flatpak on clean Ubuntu)
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: docker run --rm -e VERSION -v "$(pwd)/packaging:/pkgs:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq flatpak dbus-x11 && flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo && eval "$(dbus-launch --sh-syntax)" && export DBUS_SYSTEM_BUS_ADDRESS="$DBUS_SESSION_BUS_ADDRESS" && flatpak --user install -y --noninteractive "/pkgs/Open_Media_Converter-${VERSION}-x86_64.flatpak" && flatpak --user info io.github.albilu.OpenMediaConverter'

            - name: Create release and attach packages
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body: |
                      Packages for ${{ github.ref_name }}:

                      - `open-media-converter_${{ steps.version.outputs.version }}_amd64.deb` — Debian/Ubuntu
                      - `open-media-converter-${{ steps.version.outputs.version }}-1.x86_64.rpm` — Fedora/RHEL
                      - `open-media-converter-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst` — Arch Linux
                      - `Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.AppImage` — Universal
                      - `Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.flatpak` — Flatpak
                  files: |
                      packaging/open-media-converter_${{ steps.version.outputs.version }}_amd64.deb
                      packaging/open-media-converter-${{ steps.version.outputs.version }}-1.x86_64.rpm
                      packaging/open-media-converter-${{ steps.version.outputs.version }}-1-x86_64.pkg.tar.zst
                      packaging/Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.AppImage
                      packaging/Open_Media_Converter-${{ steps.version.outputs.version }}-x86_64.flatpak
